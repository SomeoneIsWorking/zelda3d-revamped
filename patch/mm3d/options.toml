# The game's switches (tools/z3dmods/options.py). The app's options menu lists them by label under
# their category. One with a field is a byte of the patch's block, in this order, read through
# options() from the generated options.hpp; one with choices picks one of them by its index, the
# game's own value for the game's options (game_options.cpp). One with a pad is the app's.

[[option]]
id = "cutscene_skip"
category = "Gameplay"
field = "cutsceneSkip"
label = "Cutscene skip (Start)"
default = true

[[option]]
id = "quick_text"
category = "Gameplay"
field = "quickText"
label = "Quick Text"
default = true

[[option]]
id = "autosave"
category = "Gameplay"
field = "autosave"
label = "Autosave after each scene change"
default = false

# The game's own options (decomp docs/ui.md "Options"), held in the loaded file at these choices.
[[option]]
id = "target_hold"
category = "Controls"
field = "targetHold"
label = "L-Targeting"
choices = ["Switch", "Hold"]
default = "Switch"

[[option]]
id = "free_camera_invert"
category = "Controls"
field = "freeCameraInvert"
label = "Free camera"
choices = ["Normal", "Invert Y", "Invert X", "Invert both"]
default = "Normal"

[[option]]
id = "first_person_invert"
category = "Controls"
field = "firstPersonInvert"
label = "First-person camera"
choices = ["Normal", "Invert Y", "Invert X", "Invert both"]
default = "Normal"

[[option]]
id = "swim_invert"
category = "Controls"
field = "swimInvert"
label = "Swimming"
choices = ["Normal", "Invert Y"]
default = "Normal"

[[option]]
id = "volume"
category = "Sound"
field = "volume"
label = "Volume"
choices = ["Lower", "Normal", "Higher"]
default = "Normal"

# A 60 Hz in-between of each two 30 Hz ticks, the game's draw run again (docs/plans/replay-interpolation.md).
[[option]]
id = "frame_interpolation"
category = "Display"
app = "frame_interpolation"
label = "Frame interpolation"
default = true

# Times the mouse's 0.05 degrees a count, for the camera and the aim.
[[option]]
id = "mouse_sensitivity"
category = "Controls"
pad = "mouse_scale"
label = "Mouse sensitivity"
scales = [0.25, 0.5, 0.75, 1.0, 1.5, 2.0, 3.0, 4.0]
default = 1.0

# Each size's rise in N64 units: Medium is about the painted steps' own. The stone layers are our
# own square steps in our stone texture; the others fold the game's painted steps.
[[option]]
id = "stair_steps"
category = "Gameplay"
label = "Stepped stairs"
default = "Stone medium"
layers = [
  { label = "Stone small", folder = "romfs_stairs_stone_small", rise = 5.0, style = "stone" },
  { label = "Stone medium", folder = "romfs_stairs_stone_medium", rise = 8.0, style = "stone" },
  { label = "Stone large", folder = "romfs_stairs_stone_large", rise = 11.0, style = "stone" },
  { label = "Painted small", folder = "romfs_stairs_small", rise = 5.0 },
  { label = "Painted medium", folder = "romfs_stairs_medium", rise = 8.0 },
  { label = "Painted large", folder = "romfs_stairs_large", rise = 11.0 },
]
